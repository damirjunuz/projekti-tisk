services:
  projekti-tisk:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PIN: ${ADMIN_PIN:?Nastavi skrbniški PIN v .env}
      APP_ORIGIN: ${APP_ORIGIN:-https://tisk.dservis.si}
    volumes:
      - projekti_tisk_data:/data
    ports:
      - "127.0.0.1:3105:3100"
    networks: [caddy]
volumes:
  projekti_tisk_data:
networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-n8n_n8n-network}

