services:
  projekti-tisk:
    build: .
    restart: unless-stopped
    environment:
      APP_USER: ${APP_USER:-damir}
      APP_PASSWORD: ${APP_PASSWORD:?Nastavi APP_PASSWORD v .env}
      APP_ORIGIN: ${APP_ORIGIN:?Nastavi APP_ORIGIN v .env}
    volumes:
      - projekti_tisk_data:/data
    ports:
      - "127.0.0.1:3105:3100"
    networks: [caddy]
volumes:
  projekti_tisk_data:
networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-n8n_n8n-network}
